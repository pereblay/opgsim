[theme]
base = "light"
primaryColor = "#CC4108"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F4F1"
textColor = "#242222"
linkColor = "#B83A06"
borderColor = "#DDD5CF"
font = "sans-serif"
headingFont = "serif"
headingFontSizes = ["2.8rem", "1.9rem", "1.5rem", "1.2rem", "1rem", "1rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#F4EAE3"
chartCategoricalColors = ["#CC4108", "#315F8C", "#70539B", "#297A64"]

[theme.sidebar]
backgroundColor = "#F7F4F1"
secondaryBackgroundColor = "#FFFFFF"
headingFont = "sans-serif"
headingFontSizes = ["1.5rem", "1.25rem", "1.1rem"]
